[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1predict"
version = "0.1.0"
description = "Probabilistic Formula 1 race and season forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "scipy>=1.11",
]

[project.optional-dependencies]
fastf1 = ["fastf1>=3.9"]
dev = ["pytest>=8"]

[project.scripts]
f1predict = "f1predict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
